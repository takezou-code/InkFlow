# Gradle 本身必須跑在 JDK 17，不是新 JDK。
#
# 原因：Kotlin 2.0.21 的編譯器在 JDK 21+ 上會直接丟
#   e: java.lang.IllegalArgumentException: 25.0.2
# （JVM version 字串解析失敗），連編譯都進不去。jvmToolchain(17) 只管 bytecode
# 目標，管不到 Gradle 自己跑在哪個 JDK 上——所以這裡要另外指定。
#
# 這台機器只有 Android Studio 內建的 JDK 25，foojay resolver 會另外下載一份 17，
# 路徑固定寫死。換機器時改成自己 ~/.gradle/jdks/ 底下的 adoptium-17 目錄。
org.gradle.java.home=C:/Users/Vic/.gradle/jdks/eclipse_adoptium-17-amd64-windows.2

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
